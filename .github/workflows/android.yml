name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest :core:test assembleDebug

      - name: Release build (unsigned, catches R8/ProGuard breakage)
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lightmeter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Rolling prerelease so the debug APK has a stable, direct download
      # link (Actions artifacts are zipped and need a login to fetch).
      - name: Publish debug APK to debug-latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest app/build/outputs/apk/debug/app-debug.apk \
            --prerelease \
            --title "Debug build ${GITHUB_SHA::7}" \
            --notes "Rolling debug build of branch \`${GITHUB_REF_NAME}\` for sideloading." \
            --target "$GITHUB_SHA"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
          if-no-files-found: ignore
