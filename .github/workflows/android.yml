name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest :core:test assembleDebug

      - name: Release build + Play bundle (unsigned, catches R8/ProGuard breakage)
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: thirdstop-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: thirdstop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to rolling "latest" release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Latest build (${GITHUB_SHA:0:7})" \
            --notes "Automated debug build of ${GITHUB_SHA}. Signed with the debug key — installable directly."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
          if-no-files-found: ignore
